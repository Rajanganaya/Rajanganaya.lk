<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>රාජාංගනය - Rajanganaya - ராஜாங்கனய</title>
    <!-- Google Fonts for Sinhala, English & Tamil -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #1b5e20;
            --tab-border-green: #2e7d32;
            --light-green: #4caf50;
            --water-blue: #0277bd;
            --gold-accent: #fbc02d;
            --bg-light: #f4f9f4;
            --text-dark: #263238;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Noto Sans Sinhala', 'Noto Sans Tamil', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.65;
        }

        body.lang-ta, body.lang-ta * {
            font-family: 'Noto Sans Tamil', 'Poppins', sans-serif;
        }

        /* 3-Language Visibility Control */
        body.lang-si .en, body.lang-si .ta { display: none !important; }
        body.lang-en .si, body.lang-en .ta { display: none !important; }
        body.lang-ta .si, body.lang-ta .en { display: none !important; }

        /* Top Bar & Language Switcher */
        .top-bar {
            background-color: var(--primary-green);
            color: var(--white);
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .top-bar-title {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.4px;
        }

        .lang-switch {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.18);
            color: var(--white);
            border: 1px solid var(--white);
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .lang-btn.active, .lang-btn:hover {
            background: var(--gold-accent);
            color: var(--text-dark);
            border-color: var(--gold-accent);
        }

        /* Cover Photo Section (Uses photo4.jpg) + Subtle Dew/Mist Animation */
        .hero-cover {
            position: relative;
            width: 100%;
            height: 420px;
            background: linear-gradient(rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.55)), url('photo4.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--white);
            padding: 20px;
            overflow: hidden;
        }

        /* Soft morning mist/dew overlay */
        .hero-cover::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 25%, rgba(255, 255, 255, 0.14), transparent 45%),
                        radial-gradient(circle at 80% 70%, rgba(224, 247, 250, 0.12), transparent 50%);
            animation: mistDrift 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        /* Falling light dew drops layer */
        .dew-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .dew-drop {
            position: absolute;
            top: -15px;
            width: 5px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.35);
            animation: dewFall linear infinite;
        }

        .dew-drop:nth-child(1) { left: 8%; animation-duration: 7.5s; animation-delay: 0s; width: 4px; height: 6px; }
        .dew-drop:nth-child(2) { left: 17%; animation-duration: 9.5s; animation-delay: 1.5s; opacity: 0.35; }
        .dew-drop:nth-child(3) { left: 26%; animation-duration: 8.2s; animation-delay: 3s; width: 5px; height: 8px; }
        .dew-drop:nth-child(4) { left: 35%; animation-duration: 10s; animation-delay: 0.8s; width: 4px; height: 6px; }
        .dew-drop:nth-child(5) { left: 44%; animation-duration: 7.8s; animation-delay: 2.2s; }
        .dew-drop:nth-child(6) { left: 53%; animation-duration: 9.2s; animation-delay: 4s; width: 4px; height: 6px; }
        .dew-drop:nth-child(7) { left: 62%; animation-duration: 8.6s; animation-delay: 1.2s; width: 5px; height: 8px; }
        .dew-drop:nth-child(8) { left: 71%; animation-duration: 10.5s; animation-delay: 2.8s; width: 4px; height: 6px; }
        .dew-drop:nth-child(9) { left: 80%; animation-duration: 8s; animation-delay: 0.4s; }
        .dew-drop:nth-child(10) { left: 89%; animation-duration: 9.4s; animation-delay: 3.5s; width: 4px; height: 6px; }
        .dew-drop:nth-child(11) { left: 95%; animation-duration: 8.4s; animation-delay: 1.9s; }
